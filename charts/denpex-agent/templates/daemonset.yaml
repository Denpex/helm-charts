apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: denpex-gpu-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: denpex-agent
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: denpex-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: denpex-agent
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: denpex-daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DENPEX_API_KEY
              value: {{ .Values.denpex.apiKey | quote }}
            - name: DENPEX_CLUSTER_ID
              value: {{ .Values.denpex.clusterId | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              python3 -c "import urllib.request; urllib.request.urlretrieve('https://denpex.com/agent/kubernetes/denpex-daemon.py', '/tmp/denpex-daemon.py')" && exec python3 /tmp/denpex-daemon.py

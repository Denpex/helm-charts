apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-denpex-watcher
  labels:
    app.kubernetes.io/name: denpex-gpu-watcher
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: denpex-gpu-watcher
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: denpex-gpu-watcher
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.denpex.autoCordon }}
      serviceAccountName: {{ .Release.Name }}-denpex-watcher
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: denpex-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Reading the host kernel log (/dev/kmsg) needs a privileged container, the same
          # approach the Kubernetes node-problem-detector uses. Both mounts are read-only.
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DENPEX_API_BASE
              value: {{ .Values.denpex.apiBaseUrl | quote }}
            - name: DENPEX_UPLOAD
              value: {{ .Values.denpex.upload | toString | quote }}
            - name: AUTO_CORDON
              value: {{ .Values.denpex.autoCordon | toString | quote }}
            - name: DENPEX_COOLDOWN_SECONDS
              value: {{ .Values.denpex.cooldownSeconds | toString | quote }}
            {{- if or .Values.denpex.apiKey .Values.denpex.existingSecret }}
            - name: DENPEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-denpex-secret" .Release.Name) .Values.denpex.existingSecret }}
                  key: DENPEX_API_KEY
            {{- end }}
          volumeMounts:
            - name: kmsg
              mountPath: /dev/kmsg
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: kmsg
          hostPath:
            path: /dev/kmsg
            type: CharDevice
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

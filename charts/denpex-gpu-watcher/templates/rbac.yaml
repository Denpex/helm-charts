{{- if .Values.denpex.autoCordon }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-denpex-watcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: denpex-gpu-watcher
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-denpex-cordon
  labels:
    app.kubernetes.io/name: denpex-gpu-watcher
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # Cordoning is a PATCH of spec.unschedulable on the node the pod runs on.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-denpex-cordon
  labels:
    app.kubernetes.io/name: denpex-gpu-watcher
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-denpex-cordon
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-denpex-watcher
    namespace: {{ .Release.Namespace }}
{{- end }}

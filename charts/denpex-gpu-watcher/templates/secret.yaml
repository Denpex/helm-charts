{{- if and .Values.denpex.apiKey (not .Values.denpex.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-denpex-secret
  labels:
    app.kubernetes.io/name: denpex-gpu-watcher
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DENPEX_API_KEY: {{ .Values.denpex.apiKey | quote }}
{{- end }}
